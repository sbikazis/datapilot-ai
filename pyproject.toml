[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapilot-ai"
version = "0.1.2"
description = "Adaptive data profiling, analysis and business intelligence"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1", "openpyxl>=3.1", "xlrd>=2.0.1", "streamlit>=1.40", "plotly>=5.18"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
