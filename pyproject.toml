[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapilot-ai"
version = "0.1.0"
description = "Auditable sales data cleaning and reporting for small businesses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1", "openpyxl>=3.1", "streamlit>=1.35"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
